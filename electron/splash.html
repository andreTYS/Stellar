<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    height:100vh;overflow:hidden;
    font-family:'Segoe UI',sans-serif;
  }
  .card{
    background:#080c18;
    border:1px solid #1e2d4a;
    border-radius:20px;
    padding:40px 60px;
    text-align:center;
    box-shadow:0 24px 64px rgba(0,0,0,.8);
    width:400px;
  }
  .logo{font-size:52px;margin-bottom:16px;animation:pulse 1.5s ease-in-out infinite}
  h1{font-size:22px;font-weight:800;color:#e8f0fe;letter-spacing:.02em;margin-bottom:4px}
  p{font-size:12px;color:#5c7ab0;margin-bottom:28px}
  .bar{height:4px;background:#0f1629;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar-fill{height:100%;background:linear-gradient(90deg,#4361ee,#3ecf8e);border-radius:99px;animation:load 2.5s ease-in-out forwards}
  .status{font-size:11px;color:#5c7ab0;animation:blink 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes load{from{width:0}to{width:100%}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🚀</div>
    <h1>INNOVA-STEAM</h1>
    <p>Plataforma Educativa · NASA Space Apps</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="status">Cargando…</div>
  </div>
</body>
</html>
