# ============================================================
# INNOVA-STEAM en Docker, detrás de Traefik
#
#   cp .env.ejemplo .env     y edita contraseñas y dominio
#   docker compose up -d --build
#
# Traefik se encarga del subdominio y del certificado. Sin Traefik
# (TRAEFIK_RED vacío en .env) la plataforma sale por el puerto 8080 y
# le pones delante lo que quieras; docs/demo.md tiene la config de
# nginx y de Nginx Proxy Manager.
# ============================================================
services:

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?falta DB_ROOT_PASS en .env}
      MARIADB_DATABASE: ${DB_NAME:-innovasteam}
      MARIADB_USER: ${DB_USER:-innovasteam}
      MARIADB_PASSWORD: ${DB_PASS:?falta DB_PASS en .env}
    volumes:
      - datos_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    # Sin puertos publicados: la base solo se ve desde la red interna.
    # Si la publicaras, quedaría expuesta a internet.

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-innovasteam}
      DB_USER: ${DB_USER:-innovasteam}
      DB_PASS: ${DB_PASS:?falta DB_PASS en .env}
      BASE_URL: ""
      MODO_DEMO: ${MODO_DEMO:-true}
      CHATBOT_CLAVE_MAESTRA: ${CHATBOT_CLAVE_MAESTRA:-}
    volumes:
      # Lo que suben los estudiantes sobrevive a reconstruir la imagen.
      - subidas:/var/www/html/uploads
    networks: [interna, publica]
    # Solo en el loopback del VPS: sirve para comprobar con curl desde
    # el propio servidor y NO queda expuesto a internet. Traefik llega
    # por la red de docker, no por este puerto.
    ports:
      - "127.0.0.1:${PUERTO:-8080}:80"
    labels:
      - "traefik.enable=${TRAEFIK:-true}"
      - "traefik.docker.network=${TRAEFIK_RED:-proxy}"
      - "traefik.http.routers.innovasteam.rule=Host(`${DOMINIO:?falta DOMINIO en .env}`)"
      - "traefik.http.routers.innovasteam.entrypoints=${TRAEFIK_ENTRADA:-websecure}"
      - "traefik.http.routers.innovasteam.tls.certresolver=${TRAEFIK_RESOLVER:-letsencrypt}"
      - "traefik.http.services.innovasteam.loadbalancer.server.port=80"

networks:
  # La red donde ya vive tu Traefik. Se declara externa: compose no la
  # crea, se engancha a la que existe.
  publica:
    external: true
    name: ${TRAEFIK_RED:-proxy}
  interna:

volumes:
  datos_db:
  subidas:
